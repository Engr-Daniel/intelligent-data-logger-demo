   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167766" x="38.16" y="226.235313" transform="rotate(-0 38.16 226.235313)">2  CORRUPT OBSERVATIONS, THEN RESTRICT ACCESS</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #19394d" transform="translate(103.478437 256.360469)">Shared realization:</text>
