   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19394d" x="17.28" y="33.0375" transform="rotate(-0 17.28 33.0375)">Worked evaluation: from generated episodes to auditable results</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566674" x="17.28" y="56.938359" transform="rotate(-0 17.28 56.938359)">Diagnostic policy fixed after development; references remain outside the operational evidence path.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235c96" x="152.28" y="116.629159" transform="rotate(-0 152.28 116.629159)">1  Define and generate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #19394d" transform="translate(62.187031 142.825347)">8 development / 24 evaluation sites</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #19394d" transform="translate(61.841719 154.783003)">12 matched episodes; 60 days each</text>
   </g>
   <g id="text_5">
