   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19394d" x="485.28" y="243.920313" transform="rotate(-0 485.28 243.920313)">Cross-component                 Inverter-only</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19394d" x="308.88" y="275.639375" transform="rotate(-0 308.88 275.639375)">60 days</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167766" x="432" y="274.973281" transform="rotate(-0 432 274.973281)">Full cross</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235c96" x="594" y="274.973281" transform="rotate(-0 594 274.973281)">Full inverter</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19394d" x="308.88" y="315.239375" transform="rotate(-0 308.88 315.239375)">24 hours</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167766" x="432" y="314.573281" transform="rotate(-0 432 314.573281)">Recent cross</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #235c96" x="594" y="314.573281" transform="rotate(-0 594 314.573281)">Recent inverter</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167766" x="194.4" y="399.547681" transform="rotate(-0 194.4 399.547681)">3  Run fixed tools; retain receipts</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #19394d" transform="translate(91.984375 424.546947)">288 episodes x 4 views x 3 quality levels</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #19394d" transform="translate(127.619531 436.504603)">= 3,456 paired predictions</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #70578c" x="548.28" y="399.502759" transform="rotate(-0 548.28 399.502759)">4  Score against references</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #19394d" transform="translate(444.926094 424.546947)">Correctness + coverage + false positives</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #19394d" transform="translate(471.470625 436.504603)">Installation-cluster uncertainty</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #235c96" x="38.16" y="493.355312" transform="rotate(-0 38.16 493.355312)">SEPARATE CONVERSATIONAL DEVELOPMENT PILOT</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19394d" x="360" y="516.839375" transform="rotate(-0 360 516.839375)">24 conversations: tool choice / raw response / strict checks / separate post-hoc sensitivity</text>
   </g>
